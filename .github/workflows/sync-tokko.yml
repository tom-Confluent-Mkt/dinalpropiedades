name: Sync Tokko Data

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 03:00 ART daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Dinal Tokko + enhance
        env:
          VITE_TOKKO_API_KEY: ${{ secrets.VITE_TOKKO_API_KEY }}
          VITE_ODM_TOKKO_API_KEY: ${{ secrets.VITE_ODM_TOKKO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run sync

      - name: Sync Obras de Mar Tokko + enhance
        env:
          VITE_TOKKO_API_KEY: ${{ secrets.VITE_TOKKO_API_KEY }}
          VITE_ODM_TOKKO_API_KEY: ${{ secrets.VITE_ODM_TOKKO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/sync-odm.js

      - name: Commit updated data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/properties.json \
                  public/data/developments.json \
                  public/data/desc-cache.json \
                  public/data/odm-properties.json \
                  public/data/odm-developments.json \
                  public/data/desc-cache-odm.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: auto-sync Tokko + ODM $(date -u +'%Y-%m-%d')"
            git push
          fi
